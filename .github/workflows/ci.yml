name: CI

on:
  push:
    branches: [ main, 'v*', 'dev*', 'fix/*' ]
  pull_request:
    branches: [ main, 'v*', 'dev*' ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libsm6 libxrender1 libxext6 libxkbcommon-x11-0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # NOTE: the project currently declares `jax[cuda13]` as a hard dependency,
      # which pulls several hundred MB of CUDA wheels that are useless on a CPU
      # runner. JAX_PLATFORMS=cpu keeps the tests on CPU; making the CUDA extra
      # optional in pyproject.toml is tracked as a follow-up.
      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run tests
        env:
          JAX_PLATFORMS: cpu
        run: uv run --group dev pytest -q
