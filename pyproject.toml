[project]
name = "f1tenth-planning"
version = "0.1.1"
description = "F1TENTH Motion Planning Library"
authors = [
    { name = "Hongrui Zheng" },
    { name = "Renukanandan Tumu" },
    { name = "Luigi Berducci" },
    { name = "Ahmad Amine" },
]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = "MIT"
maintainers = [{ name = "Hongrui Zheng" }]
dependencies = [
    "cvxpy",
    "osqp",
    "kiwisolver",
    "scs",
    "llvmlite",
    "numba",
    "numpy",
    "qdldl",
    "pyyaml",
    "f1tenth_gym",
    "jax>=0.4.30",
    "casadi>=3.7.2",
    # used by utils/solvers and the lattice planner respectively; previously imported
    # but never declared, so a clean install could not run them
    "scipy",
    "pyclothoids",
]

[project.optional-dependencies]
# GPU build of jax. Opt in with `uv sync --extra gpu`; the base install stays CPU-only
# so CI and non-NVIDIA machines are not forced to download the CUDA wheels.
gpu = ["jax[cuda13]>=0.4.30"]

[project.urls]
Homepage = "https://f1tenth.org"
Repository = "https://github.com/f1tenth/f1tenth_planning"
Documentation = "https://f1tenth-gym.readthedocs.io/en/latest/"

[tool.uv.sources]
f1tenth_gym = { git = "https://github.com/f1tenth/f1tenth_gym.git", branch = "dev-dynamics" }

[tool.hatchling.build.targets.wheel]
packages = ["f1tenth_planning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
# Only collect from tests/ -- never from inside the package.
testpaths = ["tests"]
markers = [
    "slow: end-to-end simulation runs (deselect with '-m \"not slow\"')",
]
